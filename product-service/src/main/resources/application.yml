spring:
  application:
    name: product-service
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    jpa:
      hibernate:
        ddl-auto: update
    profiles:
      active: cloud
cloud:
  aws:
    credentials:
      access-key: dummykey
      secret-key: dummysecret
    region:
      static: us-east-1
    dynamodb:
      endpoint: http://localhost:8000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8081