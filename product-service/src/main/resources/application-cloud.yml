spring:
  profiles:
    active: cloud
  datasource:
    url: jdbc:h2:mem:ecommerce
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
    jpa:
      hibernate:
        ddl-auto: update
    profiles:
      active: h2
  h2:
    console:
      enabled: true
      path: /h2-console
cloud:
  aws:
    credentials:
      use-default-aws-credentials-chain: true
    region:
      static: us-east-1
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
server:
  port: 8081